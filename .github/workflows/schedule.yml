name: Track Pool Visitors

on:
  schedule:
    # Runs every 5 minutes between 04:00 and 21:00 UTC (covers 06:00-22:00 Zurich time)
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries
        run: pip install selenium pandas matplotlib seaborn

      - name: Record visitor count
        run: python pool_tracker.py

      - name: Update Heatmap
        run: python visualize.py

      - name: Save updated CSV and Heatmap
        run: |
          git config user.name "Pool Tracker Bot"
          git config user.email "bot@example.com"
          
          # 1. Stage and commit first so the workspace is clean
          git add pool_visitors.csv best_times_heatmap.png
          git commit -m "Update pool data and heatmap" || echo "No changes to commit"
          
          # 2. Pull any remote updates safely, then push
          git pull --rebase || true
          git push
